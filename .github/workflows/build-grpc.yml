name: Build grpc aarch64

on:
  workflow_dispatch:
    inputs:
      grpc_version:
        description: "grpc version to build"
        required: true
        default: "1.62.3"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build grpc
        uses: docker/build-push-action@v3
        with:
          context: "{{defaultContext}}:grpc"
          platforms: linux/arm64
          build-args: VERSION=${{ inputs.grpc_version }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/torch-grpc:v${{ inputs.grpc_version }}
