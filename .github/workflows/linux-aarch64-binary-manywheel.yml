name: linux-aarch64-binary-manywheel

on:
  workflow_dispatch:
    inputs:
      grpc_version:
        description: "grpc version to use"
        required: true
        default: "1.62.3"
      torch_version:
        description: "PyTorch version to build"
        required: true
        default: "2.13.0"

permissions:
  id-token: write
  contents: read

env:
  ALPINE_IMAGE: "arm64v8/alpine"
  AWS_DEFAULT_REGION: us-east-1
  BINARY_ENV_FILE: /tmp/env
  BUILD_ENVIRONMENT: linux-aarch64-binary-manywheel
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PYTORCH_FINAL_PACKAGE_DIR: /artifacts
  PYTORCH_ROOT: /pytorch
  SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
  SKIP_ALL_TESTS: 0

jobs:
  manywheel-cpu-aarch64-build:
    name: manywheel-cpu-aarch64-build
    runs-on: ubuntu-24.04-arm
    container:
      image: xhat/torch-grpc:v${{ inputs.grpc_version }}
    env:
      PYTORCH_ROOT: ${{ github.workspace }}
      PACKAGE_TYPE: manywheel
      DESIRED_CUDA: cpu
      GPU_ARCH_VERSION: ""
      GPU_ARCH_TYPE: cpu-aarch64
      DOCKER_IMAGE: pytorch/manylinux2_28_aarch64-builder:cpu-aarch64-v${{ inputs.torch_version }}-rc15
      SKIP_ALL_TESTS: 1
      DESIRED_PYTHONS: "3.12"
      BUILD_NAME_PREFIX: "manywheel-py"
      BUILD_NAME_SUFFIX: "-cpu-aarch64"
    steps:
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/pytorch
          ref: v${{ inputs.torch_version }}
          # Full fetch on tag pushes so the release tag is visible to
          # `git describe --tags --exact`; nightlies stay shallow for speed.
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          show-progress: false
      - name: Populate binary env
        shell: bash
        run: |
          export PYTORCH_FINAL_PACKAGE_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${PYTORCH_FINAL_PACKAGE_DIR}"
          echo "PYTORCH_FINAL_PACKAGE_DIR=${PYTORCH_FINAL_PACKAGE_DIR}" >> "${GITHUB_ENV}"
          bash .ci/pytorch/binary_populate_env.sh
      - name: Build all wheels
        shell: bash
        run: |
          # shellcheck disable=SC1091
          source "${BINARY_ENV_FILE}"
          export USE_DISTRIBUTED=OFF
          export BUILD_TEST=OFF
          export USE_KINETO=OFF
          export BUILD_CUSTOM_PROTOBUF=OFF
          export CAFFE2_CUSTOM_PROTOC_EXECUTABLE=/usr/local/bin/protoc
          bash .ci/manywheel/build_all.sh
      # One artifact per built Python -- names must match what the test/upload
      # matrix below downloads.
      - uses: actions/upload-artifact@v4.4.0
        with:
          name: manywheel-py3_12-cpu-aarch64
          if-no-files-found: error
          path: ${{ runner.temp }}/artifacts/manywheel-py3_12-cpu-aarch64/*
